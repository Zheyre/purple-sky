<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starlight Drift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #120826;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      cursor: crosshair;
    }

    .sky-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* Deep cosmic midnight blue & indigo to rich purple and dreamy violet-magenta */
      background: linear-gradient(
        165deg,
        #050414 0%,
        #0a0826 18%,
        #131142 36%,
        #1f195e 54%,
        #351f78 72%,
        #52298f 88%,
        #7038a3 100%
      );
    }

    /* Soft drifting cosmic nebula cloud layers in purple, indigo, deep blue & cyan */
    .nebula {
      position: absolute;
      inset: -20%;
      pointer-events: none;
      filter: blur(65px);
      opacity: 0.72;
      mix-blend-mode: screen;
      animation: nebulaDrift 38s ease-in-out infinite alternate;
    }

    .nebula-1 {
      background:
        radial-gradient(ellipse 42% 36% at 22% 28%, rgba(79, 70, 229, 0.48) 0%, transparent 65%),
        radial-gradient(ellipse 48% 40% at 72% 26%, rgba(147, 51, 234, 0.42) 0%, transparent 68%),
        radial-gradient(ellipse 50% 42% at 48% 62%, rgba(29, 78, 216, 0.40) 0%, transparent 70%),
        radial-gradient(ellipse 35% 30% at 82% 58%, rgba(34, 211, 238, 0.22) 0%, transparent 65%);
    }

    .nebula-2 {
      background:
        radial-gradient(ellipse 46% 38% at 62% 38%, rgba(109, 40, 217, 0.45) 0%, transparent 64%),
        radial-gradient(ellipse 40% 44% at 28% 68%, rgba(30, 58, 138, 0.52) 0%, transparent 68%),
        radial-gradient(ellipse 38% 34% at 78% 74%, rgba(192, 38, 211, 0.30) 0%, transparent 64%),
        radial-gradient(ellipse 30% 26% at 35% 42%, rgba(56, 189, 248, 0.20) 0%, transparent 62%);
      animation-duration: 52s;
      animation-direction: alternate-reverse;
    }

    @keyframes nebulaDrift {
      0% {
        transform: translate3d(-2%, -1.5%, 0) scale(1) rotate(0deg);
      }
      50% {
        transform: translate3d(2%, 1.5%, 0) scale(1.06) rotate(1.5deg);
      }
      100% {
        transform: translate3d(-1%, 2.5%, 0) scale(1.02) rotate(-1deg);
      }
    }

    /* Softly glowing swirl portal of lavender, white, and cyan near the right edge */
    .portal-wrapper {
      position: absolute;
      right: 5.5vw;
      top: 26vh;
      width: 210px;
      height: 210px;
      pointer-events: none;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: portalPulse 4.6s ease-in-out infinite alternate;
      filter:
        drop-shadow(0 0 22px rgba(103, 232, 249, 0.55))
        drop-shadow(0 0 48px rgba(216, 180, 254, 0.45))
        drop-shadow(0 0 85px rgba(56, 189, 248, 0.30));
    }

    .portal-aura {
      position: absolute;
      inset: -32%;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.35) 0%,
        rgba(103, 232, 249, 0.32) 28%,
        rgba(216, 180, 254, 0.26) 52%,
        rgba(99, 102, 241, 0.12) 70%,
        transparent 82%
      );
      filter: blur(12px);
    }

    .portal-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      transform: perspective(500px) rotateY(-24deg) rotateX(14deg);
    }

    .portal-swirl-outer {
      transform-origin: 100px 100px;
      animation: portalSpin 22s linear infinite;
    }

    .portal-swirl-inner {
      transform-origin: 100px 100px;
      animation: portalSpinReverse 14s linear infinite;
    }

    @keyframes portalSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes portalSpinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes portalPulse {
      0% {
        transform: scale(0.93) translateY(-4px);
        opacity: 0.84;
      }
      50% {
        transform: scale(1.03) translateY(2px);
        opacity: 0.96;
      }
      100% {
        transform: scale(1.08) translateY(5px);
        opacity: 1;
      }
    }

    /* Main interactive canvas for twinkling stars, character sparkle trail & shooting stars */
    #sky-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 3;
    }

    /* Slow-moving Crescent Moon wrapper */
    .moon-orbit {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .moon-wrapper {
      position: absolute;
      width: 110px;
      height: 110px;
      transform: translate(-50%, -50%);
      will-change: transform, left, top;
      filter:
        drop-shadow(0 0 18px rgba(254, 243, 199, 0.65))
        drop-shadow(0 0 45px rgba(233, 213, 255, 0.55))
        drop-shadow(0 0 90px rgba(192, 132, 252, 0.4));
    }

    /* Ambient pastel halo around the moon */
    .moon-halo {
      position: absolute;
      inset: -65%;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 247, 237, 0.28) 0%,
        rgba(233, 213, 255, 0.20) 35%,
        rgba(244, 180, 218, 0.10) 60%,
        transparent 75%
      );
      animation: moonPulse 6s ease-in-out infinite alternate;
    }

    @keyframes moonPulse {
      0% {
        transform: scale(0.96);
        opacity: 0.85;
      }
      100% {
        transform: scale(1.06);
        opacity: 1;
      }
    }

    .moon-svg {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: visible;
      transform: rotate(-18deg);
    }

    /* Soft horizon cosmic mist */
    .horizon-glow {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 30vh;
      pointer-events: none;
      z-index: 4;
      background: linear-gradient(
        0deg,
        rgba(88, 28, 135, 0.34) 0%,
        rgba(49, 46, 129, 0.22) 45%,
        transparent 100%
      );
    }

    /* Soft drifting purple, indigo & deep blue clouds near bottom */
    .cloud-layer {
      position: absolute;
      left: -10%;
      width: 120%;
      bottom: -4vh;
      height: 25vh;
      pointer-events: none;
      z-index: 5;
      opacity: 0.58;
      filter: blur(24px);
      background:
        radial-gradient(ellipse 30% 60% at 15% 85%, rgba(67, 56, 202, 0.52) 0%, transparent 72%),
        radial-gradient(ellipse 36% 68% at 45% 90%, rgba(126, 34, 206, 0.48) 0%, transparent 74%),
        radial-gradient(ellipse 34% 62% at 76% 85%, rgba(29, 78, 216, 0.46) 0%, transparent 72%),
        radial-gradient(ellipse 26% 52% at 92% 92%, rgba(34, 211, 238, 0.25) 0%, transparent 70%);
      animation: cloudDrift 28s ease-in-out infinite alternate;
    }

    @keyframes cloudDrift {
      0% {
        transform: translateX(-2.5%);
      }
      100% {
        transform: translateX(2.5%);
      }
    }

    /* Cozy Storybook Chibi Floating Girl Character (~244px tall) */
    .girl-wrapper {
      position: absolute;
      left: 0;
      top: 0;
      width: 224px;
      height: 244px;
      pointer-events: none;
      z-index: 6;
      will-change: transform;
      filter:
        drop-shadow(0 4px 14px rgba(46, 16, 101, 0.38))
        drop-shadow(0 0 26px rgba(243, 232, 255, 0.35));
    }

    .girl-glow {
      position: absolute;
      inset: -16%;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 247, 237, 0.24) 0%,
        rgba(233, 213, 255, 0.20) 42%,
        rgba(216, 180, 254, 0.10) 66%,
        transparent 80%
      );
      animation: girlAuraPulse 3.6s ease-in-out infinite alternate;
    }

    @keyframes girlAuraPulse {
      0% {
        transform: scale(0.95);
        opacity: 0.82;
      }
      100% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    .girl-svg {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    /* Gentle natural blinking for her big round eyes */
    .girl-eyes-open {
      animation: girlBlink 5.4s infinite;
      transform-origin: 118px 98px;
    }

    @keyframes girlBlink {
      0%, 93%, 97%, 100% {
        transform: scaleY(1);
      }
      95% {
        transform: scaleY(0.06);
      }
    }

    /* Gentle background theme overlay for different story scenes */
    .sky-theme-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 1.5s ease, background 1.5s ease;
    }

    .sky-container[data-theme="pink-nebula"] .sky-theme-overlay {
      opacity: 0.88;
      background:
        radial-gradient(circle at 25% 30%, rgba(244, 114, 182, 0.42) 0%, transparent 60%),
        radial-gradient(circle at 75% 45%, rgba(232, 121, 249, 0.38) 0%, transparent 65%),
        linear-gradient(165deg, #1b0829 0%, #38124a 38%, #6b216b 72%, #9d3c87 100%);
    }

    .sky-container[data-theme="moon-garden"] .sky-theme-overlay {
      opacity: 0.88;
      background:
        radial-gradient(circle at 30% 25%, rgba(165, 243, 252, 0.28) 0%, transparent 58%),
        radial-gradient(circle at 70% 65%, rgba(167, 139, 250, 0.34) 0%, transparent 64%),
        linear-gradient(165deg, #061029 0%, #0e224d 36%, #1d3c73 72%, #3b529c 100%);
    }

    .sky-container[data-theme="falling-stars"] .sky-theme-overlay {
      opacity: 0.86;
      background:
        radial-gradient(circle at 50% 22%, rgba(253, 224, 71, 0.18) 0%, transparent 55%),
        radial-gradient(circle at 80% 40%, rgba(129, 140, 248, 0.36) 0%, transparent 62%),
        linear-gradient(165deg, #090621 0%, #181247 36%, #312375 72%, #59359c 100%);
    }

    .sky-container[data-theme="warm-home"] .sky-theme-overlay {
      opacity: 0.90;
      background:
        radial-gradient(circle at 50% 78%, rgba(251, 191, 36, 0.32) 0%, transparent 58%),
        radial-gradient(circle at 25% 35%, rgba(244, 114, 182, 0.28) 0%, transparent 62%),
        linear-gradient(165deg, #140b2e 0%, #2c1654 38%, #5b2978 72%, #8c4678 100%);
    }

    .sky-container[data-theme="constellation"] .sky-theme-overlay {
      opacity: 0.90;
      background:
        radial-gradient(circle at 50% 35%, rgba(196, 181, 253, 0.36) 0%, transparent 62%),
        radial-gradient(circle at 22% 65%, rgba(103, 232, 249, 0.28) 0%, transparent 58%),
        linear-gradient(165deg, #040312 0%, #0d0b33 38%, #221c63 72%, #433294 100%);
    }

    .sky-container[data-theme="cloud-bakery"] .sky-theme-overlay {
      opacity: 0.90;
      background:
        radial-gradient(circle at 68% 32%, rgba(253, 230, 138, 0.32) 0%, transparent 58%),
        radial-gradient(circle at 32% 62%, rgba(249, 168, 212, 0.36) 0%, transparent 62%),
        linear-gradient(165deg, #1c0d33 0%, #3d1c5c 38%, #6d3282 72%, #a35298 100%);
    }

    /* Portal activation state when clicking Begin */
    .portal-wrapper {
      transition: transform 1.1s cubic-bezier(0.34, 1.56, 0.64, 1), filter 1.1s ease;
    }

    .portal-wrapper.portal-activating {
      animation: none;
      transform: scale(1.75);
      filter:
        drop-shadow(0 0 36px rgba(255, 255, 255, 0.95))
        drop-shadow(0 0 68px rgba(103, 232, 249, 0.9))
        drop-shadow(0 0 120px rgba(216, 180, 254, 0.85));
    }

    .portal-wrapper.portal-activating .portal-swirl-outer {
      animation-duration: 3.5s;
    }

    .portal-wrapper.portal-activating .portal-swirl-inner {
      animation-duration: 2.2s;
    }

    /* Ensure the girl, her glow, her sparkle trail canvas, and all decorative layers never intercept clicks */
    #sky-canvas,
    .sky-theme-overlay,
    .nebula,
    .portal-wrapper,
    .portal-wrapper *,
    .moon-orbit,
    .moon-orbit *,
    .horizon-glow,
    .cloud-layer,
    .girl-wrapper,
    .girl-wrapper *,
    .girl-glow,
    .girl-svg,
    .girl-svg *,
    .screen-veil {
      pointer-events: none !important;
    }

    .girl-wrapper {
      transition: opacity 0.85s ease;
    }

    .girl-wrapper.entering-portal {
      opacity: 0;
    }

    /* Soft screen transition veil */
    .screen-veil {
      position: absolute;
      inset: 0;
      z-index: 18;
      pointer-events: none !important;
      background: radial-gradient(circle at center, #fdf4ff 0%, #e9d5ff 45%, #2e1065 100%);
      opacity: 0;
      transition: opacity 0.75s ease;
    }

    .screen-veil.active {
      opacity: 0.92;
    }

    /* Top corner controls (Ending stars tracker & Mute toggle) */
    .top-hud {
      position: absolute;
      top: 14px;
      right: 16px;
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Quicksand', 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
    }

    .hud-btn {
      background: rgba(34, 17, 68, 0.72);
      color: #f5e9ff;
      border: 2px solid rgba(216, 180, 254, 0.55);
      border-radius: 999px;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      pointer-events: auto;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(15, 7, 36, 0.35);
      transition: transform 0.18s ease, background 0.2s ease, border-color 0.2s ease;
      touch-action: manipulation;
    }

    .hud-btn:hover, .hud-btn:focus-visible {
      transform: translateY(-1px) scale(1.03);
      background: rgba(58, 29, 108, 0.85);
      border-color: #f3e8ff;
      outline: none;
    }

    /* Part 1: Interactive Loading Screen UI (z-index 30 so girl & sparkles stay visually behind) */
    .loading-ui {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(18px, 4vh, 38px) 16px clamp(24px, 5vh, 44px);
      font-family: 'Fredoka', 'Quicksand', 'Trebuchet MS', 'Comic Sans MS', system-ui, sans-serif;
      transition: opacity 0.65s ease, transform 0.65s ease, visibility 0.65s ease;
    }

    .loading-ui.hidden,
    .loading-ui.hidden * {
      opacity: 0;
      visibility: hidden;
      pointer-events: none !important;
    }

    .loading-ui.hidden {
      transform: translateY(-10px);
    }

    .title-card {
      text-align: center;
      background: rgba(29, 14, 62, 0.62);
      border: 2.5px solid rgba(233, 213, 255, 0.65);
      border-radius: 28px;
      padding: 14px 28px 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:
        0 8px 28px rgba(13, 6, 32, 0.45),
        0 0 24px rgba(216, 180, 254, 0.25);
      pointer-events: auto;
      max-width: 92vw;
    }

    .game-title {
      font-size: clamp(2rem, 5.5vw, 3.1rem);
      font-weight: 700;
      color: #fff9f5;
      letter-spacing: 0.03em;
      text-shadow:
        0 3px 0 #4a2574,
        0 0 18px rgba(233, 213, 255, 0.75);
      margin-bottom: 4px;
    }

    .title-subtitle {
      font-family: 'Quicksand', system-ui, sans-serif;
      font-size: clamp(0.84rem, 2.3vw, 0.98rem);
      font-weight: 600;
      color: #e9d5ff;
      opacity: 0.92;
    }

    /* Discovered endings little stars on the title screen */
    .endings-tracker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 8px;
      padding: 4px 13px;
      border-radius: 999px;
      background: rgba(18, 8, 42, 0.55);
      border: 1.5px solid rgba(216, 180, 254, 0.4);
      font-family: 'Quicksand', system-ui, sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      color: #f3e8ff;
    }

    .ending-star-slot {
      font-size: 1.08rem;
      color: rgba(216, 180, 254, 0.32);
      transition: color 0.3s ease, transform 0.3s ease, text-shadow 0.3s ease;
    }

    .ending-star-slot.unlocked {
      color: #fde047;
      text-shadow: 0 0 10px rgba(253, 224, 71, 0.85);
      transform: scale(1.12);
    }

    /* Bottom loading panel with star trail & Begin button */
    .loading-bottom-card {
      background: rgba(29, 14, 62, 0.72);
      border: 2.5px solid rgba(233, 213, 255, 0.65);
      border-radius: 26px;
      padding: 16px 24px 18px;
      width: min(460px, 92vw);
      text-align: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:
        0 10px 30px rgba(10, 4, 26, 0.52),
        0 0 28px rgba(192, 132, 252, 0.24);
      pointer-events: auto;
    }

    .star-bar-track {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 6px 4px 10px;
      position: relative;
    }

    .star-bar-node {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.28s ease;
      filter: drop-shadow(0 2px 3px rgba(20, 8, 44, 0.5));
    }

    .star-bar-node path {
      fill: rgba(216, 180, 254, 0.24);
      stroke: #4a2b1f;
      stroke-width: 2;
      transition: fill 0.25s ease, stroke 0.25s ease;
    }

    .star-bar-node.lit {
      transform: scale(1.18) rotate(-6deg);
      filter:
        drop-shadow(0 0 8px rgba(253, 224, 71, 0.85))
        drop-shadow(0 0 14px rgba(233, 213, 255, 0.7));
    }

    .star-bar-node.lit path {
      fill: #fef08a;
      stroke: #3d2218;
    }

    .loading-message {
      font-family: 'Quicksand', system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #fff7ed;
      min-height: 1.5em;
      margin-top: 2px;
      transition: opacity 0.25s ease;
    }

    .loading-hint {
      font-family: 'Quicksand', system-ui, sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      color: #d8b4fe;
      margin-top: 4px;
      opacity: 0.9;
    }

    .begin-btn-wrap {
      margin-top: 12px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .begin-btn {
      opacity: 0;
      visibility: hidden;
      pointer-events: none !important;
      transform: translateY(6px) scale(0.95);
      background: linear-gradient(135deg, #f3e8ff 0%, #d8b4fe 55%, #a5f3fc 100%);
      color: #2e1610;
      border: 2.5px solid #3d2218;
      border-radius: 999px;
      padding: 11px 34px;
      font-family: 'Fredoka', 'Quicksand', system-ui, sans-serif;
      font-size: 1.18rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow:
        0 4px 0 #3d2218,
        0 0 22px rgba(165, 243, 252, 0.75),
        0 0 38px rgba(216, 180, 254, 0.65);
      transition: opacity 0.45s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
      touch-action: manipulation;
    }

    .begin-btn.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto !important;
      transform: translateY(0) scale(1);
    }

    .begin-btn.visible:hover, .begin-btn.visible:focus-visible {
      transform: translateY(-2px) scale(1.05);
      box-shadow:
        0 6px 0 #3d2218,
        0 0 30px rgba(254, 240, 138, 0.9),
        0 0 48px rgba(165, 243, 252, 0.85);
      outline: none;
    }

    .begin-btn.visible:active {
      transform: translateY(2px) scale(0.99);
      box-shadow: 0 2px 0 #3d2218;
    }

    /* Part 2: Choice-Based Story Game UI (z-index 30 so the girl at z-index 6 stays visually behind it) */
    .story-ui {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: flex;
      justify-content: center;
      padding: 12px 14px clamp(14px, 3vh, 26px);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translateY(18px);
      transition: opacity 0.55s ease, transform 0.55s ease, visibility 0.55s ease;
      font-family: 'Quicksand', 'Fredoka', system-ui, sans-serif;
    }

    .story-ui:not(.active),
    .story-ui:not(.active) * {
      pointer-events: none !important;
      visibility: hidden;
    }

    .story-ui.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .story-ui.active .story-box {
      pointer-events: auto;
      visibility: visible;
    }

    .story-box {
      width: min(650px, 95vw);
      background: rgba(26, 13, 56, 0.78);
      border: 2.5px solid rgba(233, 213, 255, 0.72);
      border-radius: 26px;
      padding: 16px 20px 18px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
        0 12px 36px rgba(9, 4, 24, 0.6),
        0 0 28px rgba(216, 180, 254, 0.25);
      pointer-events: none;
      color: #fff9f5;
    }

    .story-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .scene-tag {
      font-family: 'Fredoka', 'Quicksand', system-ui, sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      color: #e9d5ff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back-btn {
      background: rgba(233, 213, 255, 0.16);
      color: #f3e8ff;
      border: 1.8px solid rgba(216, 180, 254, 0.55);
      border-radius: 999px;
      padding: 5px 13px;
      font-family: 'Quicksand', system-ui, sans-serif;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      touch-action: manipulation;
    }

    .back-btn:hover:not(:disabled), .back-btn:focus-visible:not(:disabled) {
      background: rgba(233, 213, 255, 0.28);
      transform: translateY(-1px);
      outline: none;
    }

    .back-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .ending-banner {
      display: none;
      margin-bottom: 10px;
      padding: 10px 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(254, 240, 138, 0.22), rgba(216, 180, 254, 0.28));
      border: 2px solid rgba(254, 240, 138, 0.68);
      text-align: center;
    }

    .ending-banner.visible {
      display: block;
    }

    .ending-badge {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #fde047;
      margin-bottom: 2px;
    }

    .ending-title {
      font-family: 'Fredoka', 'Quicksand', system-ui, sans-serif;
      font-size: clamp(1.15rem, 3.5vw, 1.4rem);
      font-weight: 700;
      color: #fffbeb;
      text-shadow: 0 2px 10px rgba(253, 224, 71, 0.45);
    }

    .story-text {
      font-size: clamp(0.96rem, 2.5vw, 1.08rem);
      line-height: 1.58;
      font-weight: 600;
      color: #fff8f1;
      min-height: 4.4em;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .typing-caret {
      display: inline-block;
      width: 7px;
      height: 1em;
      vertical-align: -2px;
      margin-left: 3px;
      background: #e9d5ff;
      border-radius: 3px;
      animation: caretBlink 0.8s ease-in-out infinite;
    }

    @keyframes caretBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }

    .choices-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .choice-btn {
      flex: 1 1 180px;
      min-height: 46px;
      padding: 10px 16px;
      border-radius: 18px;
      border: 2px solid rgba(233, 213, 255, 0.72);
      background: linear-gradient(135deg, rgba(88, 44, 158, 0.78) 0%, rgba(59, 30, 118, 0.85) 100%);
      color: #fff9f5;
      font-family: 'Quicksand', 'Fredoka', system-ui, sans-serif;
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.28;
      cursor: pointer;
      box-shadow:
        0 4px 12px rgba(12, 5, 32, 0.45),
        0 0 16px rgba(216, 180, 254, 0.25);
      transition: transform 0.18s ease, background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      touch-action: manipulation;
    }

    .choice-btn:hover, .choice-btn:focus-visible {
      transform: translateY(-2px);
      background: linear-gradient(135deg, rgba(118, 62, 198, 0.92) 0%, rgba(79, 42, 152, 0.92) 100%);
      border-color: #fef08a;
      box-shadow:
        0 6px 16px rgba(12, 5, 32, 0.55),
        0 0 22px rgba(254, 240, 138, 0.45);
      outline: none;
    }

    .choice-btn:active {
      transform: translateY(1px);
    }

    .choice-btn.play-again-btn {
      background: linear-gradient(135deg, #f3e8ff 0%, #d8b4fe 55%, #fde68a 100%);
      color: #2e1610;
      border-color: #3d2218;
      font-family: 'Fredoka', 'Quicksand', system-ui, sans-serif;
      font-size: 1.05rem;
      max-width: 240px;
    }

    @media (max-width: 600px) {
      .title-card {
        padding: 11px 18px 10px;
      }
      .loading-bottom-card {
        padding: 14px 16px 16px;
      }
      .star-bar-node {
        width: 22px;
        height: 22px;
      }
      .story-box {
        padding: 13px 14px 15px;
        border-radius: 22px;
      }
      .choice-btn {
        flex: 1 1 100%;
        min-height: 48px;
        font-size: 0.95rem;
      }
    }

</head>

  <script>
    (function () {
      const canvas = document.getElementById('sky-canvas');
      const ctx = canvas.getContext('2d');
      const moonEl = document.getElementById('moon');

      // Floating 2D Girl DOM elements
      const girlEl = document.getElementById('girl');
      const girlDressEl = document.getElementById('girl-dress-group');
      const girlPuffLeftEl = document.getElementById('girl-puff-left');
      const girlPuffRightEl = document.getElementById('girl-puff-right');
      const girlHairLocksEl = document.getElementById('girl-hair-locks');
      const girlArmLeftEl = document.getElementById('girl-arm-left');
      const girlArmRightEl = document.getElementById('girl-arm-right');
      const girlLegsEl = document.getElementById('girl-legs');

      let width = 0;
      let height = 0;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      // Cosmic & cyan star palette (bright cyan, aqua, lavender, periwinkle, rose, soft white)
      const STAR_COLORS = [
        { r: 103, g: 232, b: 249 }, // Luminous cyan (#67e8f9)
        { r: 34,  g: 211, b: 238 }, // Electric teal-cyan (#22d3ee)
        { r: 165, g: 243, b: 252 }, // Soft ice cyan (#a5f3fc)
        { r: 255, g: 252, b: 248 }, // Pure starlight white
        { r: 233, g: 213, b: 255 }, // Pastel lavender
        { r: 196, g: 181, b: 253 }, // Soft periwinkle
        { r: 244, g: 114, b: 182 }, // Magenta-rose
        { r: 147, g: 197, b: 253 }  // Celestial blue
      ];

      // Shooting star palettes
      const METEOR_PALETTES = [
        { head: '#ffffff', mid: '#67e8f9', tail: 'rgba(34, 211, 238, 0)' },
        { head: '#fffdf9', mid: '#e879f9', tail: 'rgba(192, 132, 252, 0)' },
        { head: '#ffffff', mid: '#a5f3fc', tail: 'rgba(129, 140, 248, 0)' },
        { head: '#fffdf9', mid: '#f472b6', tail: 'rgba(233, 213, 255, 0)' }
      ];

      let stars = [];
      let shootingStars = [];
      let trailSparkles = [];
      let girlSparkles = [];

      // Floating Girl state (smooth, delayed floaty physics)
      const girlState = {
        x: window.innerWidth * 0.52,
        y: window.innerHeight * 0.48,
        vx: 0,
        vy: 0,
        targetX: window.innerWidth * 0.52,
        targetY: window.innerHeight * 0.48,
        renderX: window.innerWidth * 0.52,
        renderY: window.innerHeight * 0.48,
        facing: 1,       // 1 = right, -1 = left
        flipScale: 1,    // smoothly interpolates toward facing
        swayAngle: 0,
        hairWavePhase: 0,
        initialized: false
      };

      // Moon slow trajectory state
      // Traverses gently across the sky in a continuous celestial arc
      let moonStartTime = performance.now();
      const MOON_CYCLE_DURATION = 240000; // 4 minutes for a full across-sky traversal
      const MOON_INITIAL_PROGRESS = 0.22; // Start nicely positioned in the upper-left/mid sky

      function createStars() {
        stars = [];
        const area = width * height;
        const count = Math.max(200, Math.min(560, Math.floor(area / 3400)));

        for (let i = 0; i < count; i++) {
          const color = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
          // Bias vertical distribution slightly toward the top/middle of the sky
          const yRatio = Math.pow(Math.random(), 1.15);
          const isSparkleStar = Math.random() < 0.16; // ~16% have 4-point cyan/lavender sparkle spikes
          const baseRadius = isSparkleStar
            ? 1.2 + Math.random() * 1.45
            : 0.45 + Math.random() * 1.3;

          stars.push({
            xRatio: Math.random(),
            yRatio: yRatio * 0.94,
            baseRadius,
            color,
            isSparkleStar,
            baseAlpha: 0.38 + Math.random() * 0.55,
            twinkleAmp: 0.22 + Math.random() * 0.45,
            twinkleSpeed: 0.0008 + Math.random() * 0.0034,
            phase: Math.random() * Math.PI * 2,
            secondarySpeed: 0.002 + Math.random() * 0.004,
            secondaryPhase: Math.random() * Math.PI * 2,
            driftSpeedX: (Math.random() - 0.5) * 0.000006,
            driftSpeedY: (Math.random() - 0.5) * 0.000003
          });
        }
      }

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (!girlState.initialized) {
          girlState.x = width * 0.52;
          girlState.y = height * 0.48;
          girlState.targetX = girlState.x;
          girlState.targetY = girlState.y;
          girlState.renderX = girlState.x;
          girlState.renderY = girlState.y;
          girlState.initialized = true;
        }
        createStars();
      }

      function spawnShootingStar(targetX, targetY) {
        const palette = METEOR_PALETTES[Math.floor(Math.random() * METEOR_PALETTES.length)];
        const fromLeft = Math.random() < 0.72;

        // Start in the upper 45% of the sky
        let startX = fromLeft
          ? width * (0.05 + Math.random() * 0.65)
          : width * (0.3 + Math.random() * 0.65);
        let startY = height * (0.04 + Math.random() * 0.35);

        // Angle downward between 18 and 38 degrees
        let angleDeg = fromLeft
          ? 18 + Math.random() * 20
          : 142 + Math.random() * 20;

        if (typeof targetX === 'number' && typeof targetY === 'number') {
          startX = Math.max(40, Math.min(width - 40, targetX - (fromLeft ? 140 : -140)));
          startY = Math.max(30, Math.min(height * 0.65, targetY - 70));
        }

        const angle = (angleDeg * Math.PI) / 180;
        const speed = 11 + Math.random() * 7; // pixels per frame at 60fps
        const tailLength = 130 + Math.random() * 110;
        const maxLife = 42 + Math.random() * 28;

        shootingStars.push({
          x: startX,
          y: startY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          tailLength,
          life: 0,
          maxLife,
          palette,
          size: 1.8 + Math.random() * 1.1
        });
      }

      // Schedule occasional autonomous shooting stars
      let nextMeteorTimeout = null;
      function scheduleNextShootingStar(initialDelay) {
        if (nextMeteorTimeout) clearTimeout(nextMeteorTimeout);
        const delay = typeof initialDelay === 'number'
          ? initialDelay
          : 2800 + Math.random() * 4400;

        nextMeteorTimeout = setTimeout(() => {
          if (!document.hidden && shootingStars.length < 3) {
            spawnShootingStar();
            // Occasional double twin-meteor shower (15% chance)
            if (Math.random() < 0.15) {
              setTimeout(() => {
                if (!document.hidden) spawnShootingStar();
              }, 350 + Math.random() * 450);
            }
          }
          scheduleNextShootingStar();
        }, delay);
      }

      function updateMoon(now) {
        const elapsed = now - moonStartTime;
        const progress = (MOON_INITIAL_PROGRESS + elapsed / MOON_CYCLE_DURATION) % 1;

        // Smooth arc across the sky from left (-8%) to right (108%)
        const xPercent = -8 + progress * 116;
        // Parabolic arc peaking around 16% from top, dipping gently to 38% near edges
        const normalizedArc = (progress - 0.5) * 2; // -1 to 1
        const yPercent = 15 + normalizedArc * normalizedArc * 22;

        // Subtle bobbing float on top of orbital motion
        const bobOffset = Math.sin(now * 0.0007) * 4;

        moonEl.style.left = `${xPercent}%`;
        moonEl.style.top = `calc(${yPercent}% + ${bobOffset.toFixed(2)}px)`;
      }

      function updateGirl(now, dtFactor) {
        // Spring-damped floaty attraction toward target cursor/touch point
        const dx = girlState.targetX - girlState.x;
        const dy = girlState.targetY - girlState.y;

        const spring = 0.0042 * dtFactor;
        const damping = Math.pow(0.89, dtFactor);

        girlState.vx = (girlState.vx + dx * spring) * damping;
        girlState.vy = (girlState.vy + dy * spring) * damping;

        // Cap max speed so she always glides serenely
        const speed = Math.hypot(girlState.vx, girlState.vy);
        const maxSpeed = 9.5;
        if (speed > maxSpeed) {
          girlState.vx = (girlState.vx / speed) * maxSpeed;
          girlState.vy = (girlState.vy / speed) * maxSpeed;
        }

        girlState.x += girlState.vx * dtFactor;
        girlState.y += girlState.vy * dtFactor;

        // Soft up-and-down bobbing motion even when mouse is completely still
        const bobY = Math.sin(now * 0.0030) * 7.5 + Math.cos(now * 0.0016) * 2.5;
        const idleFloatX = Math.sin(now * 0.0018) * 2.8;

        girlState.renderX = girlState.x + idleFloatX;
        girlState.renderY = girlState.y + bobY;

        // Face left or right depending on horizontal movement direction
        if (girlState.vx > 0.18) {
          girlState.facing = 1;
        } else if (girlState.vx < -0.18) {
          girlState.facing = -1;
        }

        // Smoothly flip horizontally when changing facing direction
        const flipLerp = 1 - Math.pow(0.82, dtFactor);
        girlState.flipScale += (girlState.facing - girlState.flipScale) * flipLerp;

        // Gentle body tilt in the direction she is drifting
        const bodyTilt = Math.max(-15, Math.min(15, girlState.vx * 2.15 + girlState.vy * 0.32 * girlState.facing));

        // Position & orient the girl wrapper (centered at 112px, 122px for 224x244 size)
        const posX = girlState.renderX - 112;
        const posY = girlState.renderY - 122;
        girlEl.style.transform =
          `translate3d(${posX.toFixed(2)}px, ${posY.toFixed(2)}px, 0) ` +
          `rotate(${bodyTilt.toFixed(2)}deg) ` +
          `scaleX(${girlState.flipScale.toFixed(3)})`;

        // Advance continuous hair wave phase (flows faster and wider when she moves)
        const moveIntensity = Math.min(1, speed / 2.4);
        girlState.hairWavePhase += (0.045 + moveIntensity * 0.088) * dtFactor;
        const hp = girlState.hairWavePhase;

        // Calculate fluffy curls, babydoll top, and chubby limb sway in local character space
        const localVx = girlState.vx * girlState.facing;
        const breezeWave = Math.sin(hp) * (3.2 + moveIntensity * 4.2);
        const secondaryWave = Math.cos(hp * 0.78 + 1.1) * (2.2 + moveIntensity * 3.0);

        const targetSway = Math.max(-16, Math.min(16, -localVx * 2.5)) + breezeWave;
        girlState.swayAngle += (targetSway - girlState.swayAngle) * (1 - Math.pow(0.84, dtFactor));

        const torsoSway = girlState.swayAngle * 0.36;
        const legDriftSway = girlState.swayAngle * 0.52 + secondaryWave * 1.0 - girlState.vy * 0.55;
        const mainHairWave = girlState.swayAngle * 0.65 + Math.sin(hp * 1.1) * (3.0 + moveIntensity * 3.8) - girlState.vy * 0.55;
        const innerHairRipple = Math.cos(hp * 1.25 + 0.7) * (1.8 + moveIntensity * 2.4);
        const hairSkew = Math.sin(hp * 1.2) * (1.8 + moveIntensity * 2.6);
        const locksSway = girlState.swayAngle * 0.48 + Math.sin(hp * 1.2 + 0.5) * (2.4 + moveIntensity * 3.0);
        const leftArmWave = Math.sin(now * 0.0034) * 4.8 + Math.min(8, Math.abs(girlState.vy) * 1.2);
        const rightArmWave = -Math.sin(now * 0.0034 + 0.4) * 4.8 - Math.min(8, Math.abs(girlState.vy) * 1.2);

        girlDressEl.style.transform = `rotate(${torsoSway.toFixed(2)}deg)`;
        girlLegsEl.style.transform = `rotate(${legDriftSway.toFixed(2)}deg)`;
        girlPuffLeftEl.style.transform = `rotate(${mainHairWave.toFixed(2)}deg) skewX(${hairSkew.toFixed(2)}deg)`;
        girlPuffRightEl.style.transform = `rotate(${innerHairRipple.toFixed(2)}deg)`;
        girlHairLocksEl.style.transform = `rotate(${locksSway.toFixed(2)}deg)`;
        girlArmLeftEl.style.transform = `rotate(${(leftArmWave + torsoSway * 0.35).toFixed(2)}deg)`;
        girlArmRightEl.style.transform = `rotate(${(rightArmWave + torsoSway * 0.35).toFixed(2)}deg)`;

        // Spawn tiny doodle sparkles and little lilac flowers behind her as she floats
        const spawnChance = (0.20 + moveIntensity * 0.72) * dtFactor;
        if (Math.random() < spawnChance && girlSparkles.length < 95) {
          const color = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
          const trailOffsetX = -girlState.vx * 2.8 + (Math.random() - 0.5) * 64;
          const trailOffsetY = 6 - girlState.vy * 2.0 + (Math.random() - 0.5) * 76;
          const roll = Math.random();
          const kind = roll < 0.28 ? 'flower' : (roll < 0.62 ? 'doodleSparkle' : 'sparkle');

          girlSparkles.push({
            x: girlState.renderX + trailOffsetX,
            y: girlState.renderY + trailOffsetY,
            vx: -girlState.vx * 0.12 + (Math.random() - 0.5) * 0.48,
            vy: -girlState.vy * 0.12 + 0.16 + (Math.random() - 0.5) * 0.38,
            radius: 1.05 + Math.random() * 1.65,
            alpha: 0.82 + Math.random() * 0.18,
            decay: 0.012 + Math.random() * 0.013,
            twinklePhase: Math.random() * Math.PI * 2,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.03,
            kind,
            petalTone: Math.random() < 0.5 ? '#e3d0ff' : '#d2b8ff',
            color
          });
        }
      }

      function drawGirlSparkles(now, dtFactor) {
        for (let i = girlSparkles.length - 1; i >= 0; i--) {
          const p = girlSparkles[i];
          p.x += p.vx * dtFactor;
          p.y += p.vy * dtFactor;
          p.rot += (p.vRot || 0) * dtFactor;
          p.alpha -= p.decay * dtFactor;

          if (p.alpha <= 0) {
            girlSparkles.splice(i, 1);
            continue;
          }

          const shimmer = 0.75 + 0.25 * Math.sin(now * 0.012 + p.twinklePhase);
          const alpha = Math.max(0, Math.min(1, p.alpha * shimmer));

          if (p.kind === 'flower') {
            // Tiny hand-drawn lilac doodle flower with soft dark brown sketchy outline
            const petalDist = p.radius * 2.1;
            const petalR = p.radius * 1.35;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.petalTone;
            ctx.strokeStyle = '#3d2218';
            ctx.lineWidth = 1.1;
            for (let k = 0; k < 5; k++) {
              const ang = (k * Math.PI * 2) / 5;
              const px = Math.cos(ang) * petalDist;
              const py = Math.sin(ang) * petalDist;
              ctx.beginPath();
              ctx.arc(px, py, petalR, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
            }
            ctx.fillStyle = '#fff0a8';
            ctx.beginPath();
            ctx.arc(0, 0, p.radius * 1.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
            continue;
          }

          if (p.kind === 'doodleSparkle') {
            // Hand-drawn 4-point doodle sparkle in warm cream/lilac with dark brown outline
            const arm = p.radius * 3.1;
            const inner = p.radius * 0.95;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot * 0.5);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#fff5cf';
            ctx.strokeStyle = '#3d2218';
            ctx.lineWidth = 1.05;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(0, -arm);
            ctx.quadraticCurveTo(inner, -inner, arm, 0);
            ctx.quadraticCurveTo(inner, inner, 0, arm);
            ctx.quadraticCurveTo(-inner, inner, -arm, 0);
            ctx.quadraticCurveTo(-inner, -inner, 0, -arm);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
            continue;
          }

          const { r, g, b } = p.color;

          // Soft pastel glow
          const glowR = p.radius * 3.2;
          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
          grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${(alpha * 0.6).toFixed(3)})`);
          grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = `rgba(255, 253, 250, ${alpha.toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * 0.75, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawStars(now, dtFactor) {
        const gx = girlState.renderX;
        const gy = girlState.renderY;
        const proximityRadius = 185; // Stars within this radius of the girl twinkle brighter
        const proximityRadiusSq = proximityRadius * proximityRadius;

        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];

          // Subtle celestial drift
          s.xRatio = (s.xRatio + s.driftSpeedX * dtFactor + 1) % 1;
          s.yRatio = (s.yRatio + s.driftSpeedY * dtFactor + 1) % 1;

          const x = s.xRatio * width;
          const y = s.yRatio * height;

          // Check distance to the floating girl character
          const dx = x - gx;
          const dy = y - gy;
          const distSq = dx * dx + dy * dy;
          let proximityBoost = 0;
          if (distSq < proximityRadiusSq) {
            const dist = Math.sqrt(distSq);
            const t = 1 - dist / proximityRadius;
            // Rapid shimmer + brightness boost when she floats nearby
            const fastTwinkle = 0.75 + 0.25 * Math.sin(now * 0.015 + s.phase * 2);
            proximityBoost = t * t * fastTwinkle;
          }

          // Dual-harmonic twinkle for organic shimmer
          const wave1 = Math.sin(now * s.twinkleSpeed + s.phase);
          const wave2 = Math.cos(now * s.secondarySpeed + s.secondaryPhase);
          const combinedWave = (wave1 * 0.7 + wave2 * 0.3);

          const baseAlpha = Math.max(0.08, Math.min(1, s.baseAlpha + combinedWave * s.twinkleAmp));
          const alpha = Math.min(1, baseAlpha + proximityBoost * 0.65);
          const radius = s.baseRadius * (0.88 + 0.24 * ((combinedWave + 1) * 0.5)) * (1 + proximityBoost * 0.65);
          const { r, g, b } = s.color;

          // Soft pastel outer glow for brighter stars or stars near the floating girl
          if (radius > 1.05 || proximityBoost > 0.12) {
            const glowRadius = radius * ((s.isSparkleStar || proximityBoost > 0.2) ? 4.8 : 3.0);
            const grad = ctx.createRadialGradient(x, y, 0, x, y, glowRadius);
            grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${(alpha * 0.58).toFixed(3)})`);
            grad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${(alpha * 0.20).toFixed(3)})`);
            grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
            ctx.fill();
          }

          // Core star body
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha.toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();

          // 4-point sparkle diffraction spikes for feature stars OR stars near the girl
          if ((s.isSparkleStar && alpha > 0.45) || proximityBoost > 0.18) {
            const spikeLen = radius * (3.8 + combinedWave * 1.8 + proximityBoost * 2.4);
            const spikeAlpha = Math.min(0.95, Math.max((alpha - 0.3) * 0.65, proximityBoost * 0.85));
            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${spikeAlpha.toFixed(3)})`;
            ctx.lineWidth = 0.85 + proximityBoost * 0.35;

            ctx.beginPath();
            ctx.moveTo(x - spikeLen, y);
            ctx.lineTo(x + spikeLen, y);
            ctx.moveTo(x, y - spikeLen);
            ctx.lineTo(x, y + spikeLen);
            ctx.stroke();
          }
        }
      }

      function drawShootingStars(dtFactor) {
        for (let i = shootingStars.length - 1; i >= 0; i--) {
          const m = shootingStars[i];
          m.x += m.vx * dtFactor;
          m.y += m.vy * dtFactor;
          m.life += dtFactor;

          const progress = m.life / m.maxLife;
          if (progress >= 1 || m.x < -200 || m.x > width + 200 || m.y > height + 200) {
            shootingStars.splice(i, 1);
            continue;
          }

          // Smooth fade-in and fade-out envelope
          const opacity = progress < 0.2
            ? progress / 0.2
            : Math.pow(1 - (progress - 0.2) / 0.8, 1.4);

          const speedMag = Math.hypot(m.vx, m.vy) || 1;
          const dirX = m.vx / speedMag;
          const dirY = m.vy / speedMag;

          const currentTailLen = m.tailLength * Math.min(1, progress * 3.2);
          const tailX = m.x - dirX * currentTailLen;
          const tailY = m.y - dirY * currentTailLen;

          // Spawn tiny pastel wake sparkles
          if (Math.random() < 0.65 * dtFactor) {
            const color = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
            trailSparkles.push({
              x: m.x - dirX * (Math.random() * 18) + (Math.random() - 0.5) * 6,
              y: m.y - dirY * (Math.random() * 18) + (Math.random() - 0.5) * 6,
              vx: (Math.random() - 0.5) * 0.4,
              vy: (Math.random() - 0.5) * 0.4 + 0.15,
              radius: 0.7 + Math.random() * 1.1,
              alpha: opacity * (0.65 + Math.random() * 0.35),
              decay: 0.022 + Math.random() * 0.02,
              color
            });
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, Math.min(1, opacity));

          // Glowing pastel meteor trail
          const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
          grad.addColorStop(0, m.palette.head);
          grad.addColorStop(0.28, m.palette.mid);
          grad.addColorStop(1, m.palette.tail);

          ctx.strokeStyle = grad;
          ctx.lineWidth = m.size;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(m.x, m.y);
          ctx.lineTo(tailX, tailY);
          ctx.stroke();

          // Luminous meteor head halo
          const headGlow = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.size * 6);
          headGlow.addColorStop(0, 'rgba(255, 253, 249, 0.95)');
          headGlow.addColorStop(0.35, m.palette.mid);
          headGlow.addColorStop(1, 'rgba(233, 213, 255, 0)');
          ctx.fillStyle = headGlow;
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.size * 6, 0, Math.PI * 2);
          ctx.fill();

          // Crisp four-point star flare at the meteor head
          const flareSize = m.size * 4.2;
          ctx.strokeStyle = 'rgba(255, 253, 250, 0.85)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(m.x - flareSize, m.y);
          ctx.lineTo(m.x + flareSize, m.y);
          ctx.moveTo(m.x, m.y - flareSize);
          ctx.lineTo(m.x, m.y + flareSize);
          ctx.stroke();

          ctx.restore();
        }

        // Update & draw trailing pastel dust particles
        for (let i = trailSparkles.length - 1; i >= 0; i--) {
          const p = trailSparkles[i];
          p.x += p.vx * dtFactor;
          p.y += p.vy * dtFactor;
          p.alpha -= p.decay * dtFactor;

          if (p.alpha <= 0) {
            trailSparkles.splice(i, 1);
            continue;
          }

          const { r, g, b } = p.color;
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${p.alpha.toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function playChime(notes, duration = 0.22) {
        if (!hasBegunOnce || isMuted) return;
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!audioCtx) audioCtx = new AudioContextClass();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          const nowSec = audioCtx.currentTime;
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, nowSec + idx * 0.08);
            gain.gain.setValueAtTime(0.0001, nowSec + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.055, nowSec + idx * 0.08 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, nowSec + idx * 0.08 + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(nowSec + idx * 0.08);
            osc.stop(nowSec + idx * 0.08 + duration + 0.02);
          });
        } catch (e) {
          // Ignore audio errors
        }
      }

      function updateLoadingStep(dt) {
        if (gamePhase !== 'loading') return;

        // Fill 100% over 5000ms (20% per second)
        loadProgress = Math.min(100, loadProgress + (dt / 5000) * 100);
        const litCount = Math.floor((loadProgress / 100) * starBarNodes.length);

        starBarTrackEl.setAttribute('aria-valuenow', String(Math.round(loadProgress)));
        for (let i = 0; i < starBarNodes.length; i++) {
          if (i < litCount) {
            starBarNodes[i].classList.add('lit');
          } else {
            starBarNodes[i].classList.remove('lit');
          }
        }

        if (loadProgress >= 100) {
          gamePhase = 'ready';
          loadingMessageEl.textContent = 'The starlight portal is ready! ✨';
          loadingHintEl.textContent = 'Click or tap Begin to drift into the story';
          beginBtnEl.classList.add('visible');
        } else {
          const msgIdx = Math.min(
            LOADING_MESSAGES.length - 1,
            Math.floor((loadProgress / 100) * LOADING_MESSAGES.length)
          );
          if (msgIdx !== lastMsgIndex) {
            lastMsgIndex = msgIdx;
            loadingMessageEl.textContent = LOADING_MESSAGES[msgIdx];
          }
        }
      }

            { label: 'Turn back upward to guard the high night sky', next: 'celestial_loom' }
          ]
        },
        celestial_loom: {
          tag: '✦ Scene 9 · The Heart of the Night Sky',
          theme: 'constellation',
          text: 'At the very top of the night, tiny unlit stars gather around her chubby hands, warming themselves against her lilac doodle-sparkles. A soft golden stairwell still leads back down to her rooftop, while the Loom of Stars hums a gentle invitation to stay.',
          choices: [
            { label: 'Stay and weave a new constellation in the sky', next: 'ending_2' },
            { label: 'Promise to visit tomorrow and take the stairs home', next: 'ending_1' }
          ]
        },
        ending_1: {
          tag: '✦ Happy Ending',
          theme: 'warm-home',
          endingNumber: 1,
          endingTitle: 'Warm Cocoa & Windowlight',
          text: 'She glides softly through her open bedroom window and lands on her patchwork quilt with a tiny, cozy bounce. Outside the glass, the purple night sky and the glowing portal give one last friendly wink—promising she can visit the stars in her dreams whenever she wishes.',
          choices: []
        },
        ending_2: {
          tag: '✦ Bittersweet Ending',
          theme: 'constellation',
          endingNumber: 2,
          endingTitle: 'The Little Keeper of Stars',
          text: 'Though she will miss her quiet room below, she opens her hands and lets her lilac doodle-flowers bloom across the dark heavens. Forever after, travelers who look up at the purple night sky see the Cozy Star-Keeper constellation shining warmly to guide every lost dreamer home.',
          choices: []
        },
        ending_3: {
          tag: '✦ Surprise Ending',
          theme: 'cloud-bakery',
          endingNumber: 3,
          endingTitle: 'The Secret Cloud-Bakery Express',
          text: 'With a cheerful ding, the tram glides right into the hollow of the crescent moon—revealing a bustling bakery run by plump moon-bunnies in flour-dusted aprons! Crowned Official Taster of Stardust Croissants, she spends the night floating between sugar-cloud tables before catching the sunrise delivery home.',
          choices: []
        }
      };

      let currentSceneId = 'start';
      let sceneHistory = [];
      let typingTimer = null;
      let isTyping = false;
      let fullTargetText = '';
      let currentCharIndex = 0;

      function stopTyping(showFull) {
        if (typingTimer) {
          clearInterval(typingTimer);
          typingTimer = null;
        }
        isTyping = false;
        if (showFull) {
          storyTextEl.textContent = fullTargetText;
        }
      }

      function startTypewriter(text) {
        stopTyping(false);
        fullTargetText = text;
        currentCharIndex = 0;
        isTyping = true;
        storyTextEl.innerHTML = '<span class="typing-caret"></span>';

        typingTimer = setInterval(() => {
          currentCharIndex++;
          if (currentCharIndex >= fullTargetText.length) {
            stopTyping(true);
            return;
          }
          const slice = fullTargetText.slice(0, currentCharIndex);
          storyTextEl.textContent = slice;
          const caret = document.createElement('span');
          caret.className = 'typing-caret';
          storyTextEl.appendChild(caret);
        }, 20);
      }

      // Clicking/tapping the story text finishes typing immediately
      storyTextEl.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isTyping) {
          stopTyping(true);
        }
      });

      function showScene(sceneId, pushToHistory = true) {
        const scene = STORY_SCENES[sceneId];
        if (!scene) return;

        if (pushToHistory && currentSceneId && sceneId !== currentSceneId) {
          sceneHistory.push(currentSceneId);
        }
        currentSceneId = sceneId;

        // Update background theme smoothly
        skyEl.setAttribute('data-theme', scene.theme || 'default');

        // Spawn extra celebratory shooting stars on falling-stars scenes or endings
        if (scene.theme === 'falling-stars' || scene.endingNumber) {
          spawnShootingStar();
          setTimeout(() => spawnShootingStar(), 320);
        }

        sceneTagEl.textContent = scene.tag;
        backBtnEl.disabled = sceneHistory.length === 0;

        if (scene.endingNumber) {
          saveEndingToStorage(scene.endingNumber);
          endingBadgeEl.textContent = `Ending ${scene.endingNumber} of 3`;
          endingTitleEl.textContent = scene.endingTitle;
          endingBannerEl.classList.add('visible');
          playChime([523.25, 659.25, 783.99, 1046.5], 0.35);
        } else {
          endingBannerEl.classList.remove('visible');
        }

        startTypewriter(scene.text);

        // Render choice buttons or Play Again button
        choicesListEl.innerHTML = '';
        if (scene.endingNumber) {
          const playAgainBtn = document.createElement('button');
          playAgainBtn.type = 'button';
          playAgainBtn.className = 'choice-btn play-again-btn';
          playAgainBtn.textContent = 'Play Again ✦';
          playAgainBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            playChime([587.33, 783.99]);
            sceneHistory = [];
            currentSceneId = 'start';
            showScene('start', false);
          });
          choicesListEl.appendChild(playAgainBtn);

          const titleBtn = document.createElement('button');
          titleBtn.type = 'button';
          titleBtn.className = 'choice-btn';
          titleBtn.style.maxWidth = '220px';
          titleBtn.textContent = 'Title Screen ★';
          titleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            playChime([659.25, 523.25]);
            returnToTitleScreen();
          });
          choicesListEl.appendChild(titleBtn);
        } else {
          scene.choices.forEach((choice) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'choice-btn';
            btn.textContent = choice.label;
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              playChime([523.25, 659.25]);
              showScene(choice.next, true);
            });
            choicesListEl.appendChild(btn);
          });
        }
      }

      backBtnEl.addEventListener('click', (e) => {
        e.stopPropagation();
        if (sceneHistory.length === 0) return;
        playChime([587.33, 493.88]);
        const prevSceneId = sceneHistory.pop();
        currentSceneId = prevSceneId;
        showScene(prevSceneId, false);
      });

      function returnToTitleScreen() {
        stopTyping(false);
        storyUiEl.classList.remove('active');
        skyEl.setAttribute('data-theme', 'default');
        loadingUiEl.classList.remove('hidden');
        gamePhase = 'ready';
      }

      // Clicking "Begin ✦" makes the portal swirl brighter & grow, she floats into it, and fades into the story
      beginBtnEl.addEventListener('click', (e) => {
        e.stopPropagation();
        if (gamePhase !== 'ready') return;
        gamePhase = 'portal-transition';

        hasBegunOnce = true;
        updateMuteButtonText();
        playChime([523.25, 659.25, 783.99, 987.77], 0.32);

        loadingUiEl.classList.add('hidden');
        portalEl.classList.add('portal-activating');

        // Guide the girl directly into the glowing portal
        const rect = portalEl.getBoundingClientRect();
        const portalCenterX = rect.left + rect.width * 0.5;
        const portalCenterY = rect.top + rect.height * 0.5;
        girlState.targetX = portalCenterX;
        girlState.targetY = portalCenterY;
        spawnClickSparkleBurst(portalCenterX, portalCenterY);

        setTimeout(() => {
          girlEl.classList.add('entering-portal');
          screenVeilEl.classList.add('active');
        }, 620);

        setTimeout(() => {
          // Emerge gently into Scene 1 in the upper-middle sky above the story box
          portalEl.classList.remove('portal-activating');
          girlEl.classList.remove('entering-portal');
          girlState.x = width * 0.5;
          girlState.y = height * 0.33;
          girlState.targetX = width * 0.5;
          girlState.targetY = height * 0.33;
          girlState.vx = 0;
          girlState.vy = 0;

          gamePhase = 'story';
          sceneHistory = [];
          currentSceneId = 'start';
          showScene('start', false);
          storyUiEl.classList.add('active');
          screenVeilEl.classList.remove('active');
        }, 1350);
      });

      let lastTime = performance.now();
      function animate(now) {
        const dt = Math.min(50, now - lastTime);
        const dtFactor = dt / 16.667;
        lastTime = now;

        ctx.clearRect(0, 0, width, height);

        updateLoadingStep(dt);
        updateMoon(now);
        updateGirl(now, dtFactor);
        drawStars(now, dtFactor);
        drawGirlSparkles(now, dtFactor);
        drawShootingStars(dtFactor);

        requestAnimationFrame(animate);
      }

      function isEventInsideUI(e) {
        if (!e || !e.target || typeof e.target.closest !== 'function') return false;
        return Boolean(
          e.target.closest('.story-box') ||
          e.target.closest('.loading-bottom-card') ||
          e.target.closest('.title-card') ||
          e.target.closest('.top-hud')
        );
      }

      function setGirlTarget(clientX, clientY) {
        if (gamePhase === 'portal-transition') return;
        const margin = 88;
        girlState.targetX = Math.max(margin, Math.min(width - margin, clientX));
        girlState.targetY = Math.max(margin, Math.min(height - margin, clientY));
      }

      // Mouse and pointer movement
      window.addEventListener('pointermove', (e) => {
        setGirlTarget(e.clientX, e.clientY);
      }, { passive: true });

      // Clicking or tapping stars in the sky makes them sparkle & fills the loading bar faster
      window.addEventListener('pointerdown', (e) => {
        if (isEventInsideUI(e)) return;
        setGirlTarget(e.clientX, e.clientY);
        spawnShootingStar(e.clientX, e.clientY);
        spawnClickSparkleBurst(e.clientX, e.clientY);

        if (gamePhase === 'loading') {
          loadProgress = Math.min(100, loadProgress + 9);
          updateLoadingStep(0);
        }
      }, { passive: true });

      // Touch support so she smoothly follows your finger on phones
      window.addEventListener('touchstart', (e) => {
        if (isEventInsideUI(e)) return;
        if (e.touches && e.touches.length > 0) {
          setGirlTarget(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 0) {
          setGirlTarget(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('resize', resize);

      resize();
      // Launch an initial shooting star shortly after load, then continue occasionally
      scheduleNextShootingStar(1200);
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
